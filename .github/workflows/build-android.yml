name: Build Dr Browser v8.0 (Sticky Anti-Censorship Proxy + Audio HLS + Resumable IDM)

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish APKs to GitHub Releases"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build & Verify Dr Browser v8.0 (API 21–35+, All 4 ABIs, Play Protect Clean)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Cache Go Modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-drbrowser-v6-${{ hashFiles('native/gfproxy/go.mod') }}
          restore-keys: |
            go-mod-drbrowser-v6-
            go-mod-drbrowser-v5-

      - name: Resolve Go Modules & Run Multi-Source + JNI Control Engine Tests
        working-directory: native/gfproxy
        run: |
          set +e
          GOTOOLCHAIN=auto go mod tidy > go_test.log 2>&1
          GOTOOLCHAIN=auto go test -v -race -timeout 90s ./... >> go_test.log 2>&1
          RC=$?
          cat go_test.log
          if [[ "$RC" -ne 0 ]]; then
            TAIL_GO="$(tail -n 55 go_test.log | sed 's/%/%25/g; s/\r/%0D/g' | paste -sd '|' - | sed 's/|/%0A/g')"
            echo "::error title=GoTestFailed::${TAIL_GO}"
            exit "$RC"
          fi
          set -e

      - name: Ensure Android SDK Licenses & NDK with API 21 Toolchain
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          FOUND_NDK=""
          if [[ -d "$SDK_ROOT/ndk" ]]; then
            for d in $(ls -1d "$SDK_ROOT"/ndk/* 2>/dev/null | sort -Vr); do
              if [[ -x "$d/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang" ]]; then
                FOUND_NDK="$d"
                break
              fi
            done
          fi
          if [[ -z "$FOUND_NDK" ]]; then
            echo "Installing Android NDK 27.2.12479018 (includes API 21 Clang + 16KB page support)..."
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" >/dev/null
            FOUND_NDK="$SDK_ROOT/ndk/27.2.12479018"
          fi
          echo "ANDROID_NDK_HOME=$FOUND_NDK" >> "$GITHUB_ENV"
          echo "Using ANDROID_NDK_HOME=$FOUND_NDK"

      - name: Cache Compiled 4-ABI JNI Shared Library (libgfproxy.so)
        id: cache-jni
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs
          key: jnilibs-cshared-drbrowser-v6-${{ hashFiles('scripts/build-gfproxy-android.sh', 'native/gfproxy/**') }}

      - name: Cross-Compile True JNI C-Shared libgfproxy.so (All 4 ABIs, API 21, 16KB Page Aligned)
        if: steps.cache-jni.outputs.cache-hit != 'true'
        run: |
          set +e
          ./scripts/build-gfproxy-android.sh > native_build.log 2>&1
          RC=$?
          cat native_build.log
          if [[ "$RC" -ne 0 ]]; then
            TAIL_NATIVE="$(tail -n 55 native_build.log | sed 's/%/%25/g; s/\r/%0D/g' | paste -sd '|' - | sed 's/|/%0A/g')"
            echo "::error title=NativeBuildFailed::${TAIL_NATIVE}"
            exit "$RC"
          fi
          set -e

      - name: Restore Consistent Developer Release Keystore (Play Protect Identity Continuity)
        uses: actions/cache@v4
        with:
          path: keystore
          key: drbrowser-release-keystore-v6-consistent
          restore-keys: |
            drbrowser-release-keystore-v6-

      - name: Prepare V1 + V2 + V3 Release Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./scripts/ensure-keystore.sh

      - name: Run Unit Tests & Assemble R8-Shrunk Release + Debug APKs
        run: |
          set +e
          ./gradlew testDebugUnitTest assembleRelease assembleDebug --no-daemon --stacktrace > gradle_build.log 2>&1
          RC=$?
          cat gradle_build.log
          if [[ "$RC" -ne 0 ]]; then
            ERR_SUMMARY="$(grep -iE '(^e: |error:|\[Dagger|Caused by:|FAILURE:|^\* What went wrong:|^  > |Exception:|FAILED)' gradle_build.log | head -n 55 | sed 's/%/%25/g; s/\r/%0D/g' | paste -sd '|' - | sed 's/|/%0A/g')"
            TAIL_SUMMARY="$(tail -n 55 gradle_build.log | sed 's/%/%25/g; s/\r/%0D/g' | paste -sd '|' - | sed 's/|/%0A/g')"
            echo "::error title=GradleErrorSummary::${ERR_SUMMARY}"
            echo "::error title=GradleLogTail::${TAIL_SUMMARY}"
            exit "$RC"
          fi
          set -e

      - name: Verify All 4 CPU Architectures, Play Protect Compliance & API 21 Signatures
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -name apksigner | sort -V | tail -n 1)"
          AAPT2="$(find "$SDK_ROOT/build-tools" -name aapt2 | sort -V | tail -n 1)"

          REL_DIR="app/build/outputs/apk/release"
          mkdir -p dist

          cp "$REL_DIR/app-universal-release.apk"   "dist/Dr-Browser-v8.0.0-universal-release.apk"
          cp "$REL_DIR/app-arm64-v8a-release.apk"   "dist/Dr-Browser-v8.0.0-arm64-v8a-release.apk"
          cp "$REL_DIR/app-armeabi-v7a-release.apk" "dist/Dr-Browser-v8.0.0-armeabi-v7a-release.apk"
          cp "$REL_DIR/app-x86_64-release.apk"      "dist/Dr-Browser-v8.0.0-x86_64-release.apk"
          cp "$REL_DIR/app-x86-release.apk"         "dist/Dr-Browser-v8.0.0-x86-release.apk"

          UNIV="dist/Dr-Browser-v8.0.0-universal-release.apk"
          unzip -l "$UNIV" > zip_list.txt

          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            grep -Fq "lib/$abi/libgfproxy.so" zip_list.txt || {
              echo "::error title=MissingNativeLib::MISSING native library lib/$abi/libgfproxy.so in Universal APK"
              exit 1
            }
          done
          echo "Verified JNI C-shared libgfproxy.so across all 4 CPU ABIs inside Universal APK!"

          for apk in dist/*.apk; do
            "$APKSIGNER" verify --verbose --min-sdk-version 21 "$apk" > apksigner_out.txt 2>&1 || {
              ERR_SIGN="$(cat apksigner_out.txt | paste -sd '|' - | sed 's/|/%0A/g')"
              echo "::error title=ApkSignerFailed::${ERR_SIGN}"
              exit 1
            }
          done
          cat apksigner_out.txt

          if [[ -n "$AAPT2" && -x "$AAPT2" ]]; then
            "$AAPT2" dump badging "$UNIV" > badging.txt
            grep -E "package:|sdkVersion:|targetSdkVersion:|native-code:|uses-permission:" badging.txt || true
            if grep -Eq "REQUEST_INSTALL_PACKAGES|QUERY_ALL_PACKAGES|BIND_ACCESSIBILITY_SERVICE|SYSTEM_ALERT_WINDOW|READ_SMS|RECEIVE_SMS" badging.txt; then
              echo "::error title=PlayProtectViolation::Forbidden high-risk permission detected in merged APK manifest!"
              cat badging.txt
              exit 1
            fi
          fi

          rm -f zip_list.txt apksigner_out.txt badging.txt

          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          NOTICE_BODY="$(ls -lh dist/*.apk | awk '{print $9 ": " $5}' | paste -sd '|' - | sed 's/|/%0A/g')"
          echo "::notice title=BuiltAPKs::${NOTICE_BODY}"

          {
            echo "## ⚡ Dr Browser v8.0 — Sticky Anti-Censorship Proxy + Dual-Track HLS Audio/MP4 Merger + Resumable IDM v8"
            echo ""
            echo "- **100% Google Play Protect Compliant:** True \`-buildmode=c-shared\` JNI native engine (\`System.loadLibrary(\"gfproxy\")\`, zero \`ProcessBuilder\`/\`setExecutable\`), zero \`REQUEST_INSTALL_PACKAGES\`, strict \`SslErrorHandler.cancel()\`, zero private-API reflection, clean \`io.github.has2sanbaba.drbrowser\` identity & cached V1+V2+V3 keystore"
            echo "- **Sticky Startup Proxy + User-Confirmed Better-Server Upgrade:** Connects automatically at startup and keeps exit IP pinned (never auto-switches mid-session or mid-download); notifies user via Snackbar/card when a significantly faster proxy is found"
            echo "- **Dual-Track HLS Audio+Video Lossless MP4 Merger + AES-128 & BYTERANGE:** Pairs \`#EXT-X-MEDIA:TYPE=AUDIO\` renditions with video variants, supports \`fMP4\` (\`#EXT-X-MAP\`), MPEG-TS, ADTS \`csd-0\`, Packed-Audio \`ID3\` stripping, and RFC 8216 \`AES-128\`"
            echo "- **True Shard & Segment Pause/Resume + Rebuilt v8 Video Discovery:** Per-part \`.part0..N\` Range checkpoints & \`.hlsdir/*.done\` segment resume, plus \`DOCUMENT_START\` cross-frame \`JSON.parse\`/\`fetch\`/\`XHR\`/\`#EXTM3U\` primary stream sniffer"
            echo ""
            echo "### 📦 Ready-to-Install Lightweight Release APKs"
            echo "| File | Size | SHA-256 |"
            echo "|---|---|---|"
            for f in dist/*.apk; do
              bn="$(basename "$f")"
              sz="$(du -h "$f" | cut -f1)"
              sh="$(sha256sum "$f" | cut -d' ' -f1)"
              echo "| \`$bn\` | $sz | \`$sh\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Signed Release APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dr-Browser-v8-APKs
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      - name: Upload Debug Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dr-Browser-v8-Debug-APK
          path: app/build/outputs/apk/debug/app-universal-debug.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Publish GitHub Release Automatically (Main Branch, Tags, or Manual Dispatch)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v8.0.0-build.{0}', github.run_number) }}
          name: "Dr Browser v8.0 Sticky Proxy + Audio HLS + Resumable IDM (${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Build #{0}', github.run_number) }})"
          generate_release_notes: true
          files: |
            dist/Dr-Browser-v8.0.0-universal-release.apk
            dist/Dr-Browser-v8.0.0-arm64-v8a-release.apk
            dist/Dr-Browser-v8.0.0-armeabi-v7a-release.apk
            dist/Dr-Browser-v8.0.0-x86_64-release.apk
            dist/Dr-Browser-v8.0.0-x86-release.apk
            dist/SHA256SUMS.txt
